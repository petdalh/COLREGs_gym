training_configuration:
  algorithm: PPO
  policy: MlpPolicy
  remove_existing_logging: false
  training_timesteps: 100000
  checkpoint_dir: checkpoints/ppo_mask
  checkpoint_freq: 5000
  tensorboard_log: logs/colregs_ppo
  plot_dir: plots
  plot_every_episodes: 50
  policy_net_arch: [128, 128]
  n_steps: 128
  batch_size: 32
  learning_rate: 3.0e-4

environment_configuration:
  dt: 0.5
  grid_width: 25.0
  grid_height: 30.0
  decision_interval: 10
  sim_dt: 0.5

  action_configuration:
    heading_offsets_deg: [-15, -10, -5, 0, 5, 10, 15]
    speed_multipliers: [0.7, 0.8, 0.9, 1.0]

  masking_configuration:
    sim_dt: 0.5
    k_heading: 1.0
    k_speed: 0.5
    a_max: 0.1

  encounter_configuration:
    start_position: [1.5, 7.5, 0.0]
    wave_conditions: [0.05, 1.5, 0.0]
    encounter_type: crossing
    separation: 14.0
    target_speed: 0.2
    goal_ahead_distance: 25.0
    collision_radius: 1.0
    simtime: 200.0
    maneuver_horizon: 10.0

  monitoring_configuration:
    masking_enabled: false
    monitoring_radius: 12.0
    monitoring_radius_safety_factor: 3.0
    robustness_margin: 3.0
    robustness_sampling_rate: 5
    mask_recompute_interval: 2

  reward_configuration:
    reward_progress:
      is_enabled: true
      coefficient: 1.0
    reward_cte:
      is_enabled: true
      coefficient: -0.005
      clip: 5.0
    reward_speed:
      is_enabled: true
      coefficient: -0.02
    reward_heading:
      is_enabled: true
      coefficient: 0.1
    reward_fallback:
      is_enabled: false
      coefficient: -0.2
