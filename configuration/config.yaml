wandb_configuration:
  project: "colregs-ppo"      
  run_name: null                
  group: null                   
  enabled: true

training_configuration:
  algorithm: PPO
  policy: MlpPolicy
  remove_existing_logging: false
  training_timesteps: 10000
  checkpoint_dir: checkpoints/ppo_mask
  checkpoint_freq: 10000
  tensorboard_log: logs/colregs_ppo
  plot_dir: plots
  plot_every_episodes: 100
  policy_net_arch: [128, 128]
  n_steps: 1024
  batch_size: 64
  learning_rate: 3.0e-4

environment_configuration:
  dt: 0.5
  grid_width: 25.0
  grid_height: 30.0
  decision_interval: 10
  sim_dt: 0.5

  action_configuration:
    heading_offsets_deg: [-20, -15,-10, -5, 0, 5, 10, 15, 20]
    speed_multipliers: [0.7, 0.8, 0.9, 1.0]

  masking_configuration:
    sim_dt: 0.5
    k_heading: 1.0
    k_speed: 0.5
    a_max: 0.1
    decision_depth: 2
    certification_margin: 2.0
    tube_step_factor: 4       # use every 4th tube step per BFS depth
    fix_speed_at_depth: true  # fix speed at depth > 0, only vary heading
    pruning_threshold: -5.0   # prune branches > 5 units below cert margin

  encounter_configuration:
    start_position: [1.5, 7.5, 0.0]
    wave_conditions: [0.05, 1.5, 0.0]
    encounter_type: crossing
    separation: 18.0
    target_speed: 0.2
    goal_ahead_distance: 30.0
    collision_radius: 1.0
    simtime: 250.0
    maneuver_horizon: 10.0

  monitoring_configuration:
    masking_enabled: false
    monitoring_radius: 12.0
    monitoring_radius_safety_factor: 0.0
    robustness_margin: 10.0
    robustness_sampling_rate: 1
    mask_recompute_interval: 1

  reward_configuration:
    # Base handlers (disabled in favour of ColregsReward equivalents below) 
    reward_progress: # Redundant with reward_goal_distance; included for reference and potential future use
      is_enabled: false
      coefficient: 1.0
    reward_cte: # Redundant with reward_lateral_deviation; included for reference and potential future use
      is_enabled: false
      coefficient: -0.005
      clip: 5.0
    reward_speed: # Redundant with reward_velocity; included for reference and potential future use
      is_enabled: false
      coefficient: -0.02
    reward_heading:
      is_enabled: false
      coefficient: 0.1
    reward_fallback:
      is_enabled: false
      coefficient: -1

    # ColregsReward handlers
    reward_acceleration:
      is_enabled: true
      coefficient: -0.05

    reward_termination:
      is_enabled: true
      reward_goal_reached:    50.0
      reward_collision:      -50.0
      reward_time_out:       -20.0
      reward_out_of_bounds:  -20.0

    reward_velocity:
      is_enabled: true
      # Set to match active speed_multipliers range
      low_threshold:   0.9
      high_threshold:  1.0
      coefficient:     1.0

    reward_goal_distance:
      is_enabled: true
      final_approach_start_dist:           5.0   # c1
      euclidean_advance_coeff:             1.0   # c2
      orientation_advance_coeff:           1.0   # c3
      final_approach_euclidean_dist_coeff: 0.0   # c5 (set negative to enable)
      final_approach_distance_coeff:       1.0   # c6
      final_approach_linearization_coeff:  0.0   # c7 (set positive to enable)
      timestep_normalization:             5 

    reward_lateral_deviation:
      is_enabled: true
      coefficient:              -0.005   # c4
      clip:                      5.0    # c8 (0 = no clip)
      final_approach_start_dist: 5.0    # c1

    reward_safe_distance:
      is_enabled: true
      magnitude:                   75.0
      clip:                       -10.0
      starboard_static_coeff:      0.007
      port_static_coeff:           0.09
      stern_static_coeff:          0.01
      starboard_dyn_plus_coeff:    0.004
      starboard_dyn_minus_coeff:   0.05
      port_dyn_plus_coeff:         0.007
      port_dyn_minus_coeff:        0.005
      stern_dyn_plus_coeff:        0.007
      stern_dyn_minus_coeff:       0.005
