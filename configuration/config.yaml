wandb_configuration:
  project: "idun-test"      
  run_name: min_max_depth_run
  group: null                   
  enabled: true

training_configuration:
  algorithm: PPO
  policy: MlpPolicy
  remove_existing_logging: true
  training_timesteps: 100000
  checkpoint_dir: checkpoints/ppo_mask
  checkpoint_freq: 100000
  tensorboard_log: logs/colregs_ppo
  plot_dir: plots
  plot_every_episodes: 50
  num_envs: null                 # null -> SLURM_CPUS_PER_TASK if set, otherwise 1
  pin_memory: false              # CPU training; only relevant for GPU data loading
  print_episode_summary: false   # avoids noisy interleaved Slurm logs with subprocess envs
  vec_env_start_method: forkserver
  policy_net_arch: [128, 128]
  n_steps: 512
  batch_size: 256
  learning_rate: 3.0e-4

environment_configuration:
  controller_type: mrac   # backstepping | mrac
  dt: 0.25
  grid_width: 25.0
  grid_height: 62.0
  decision_interval: 20
  sim_dt: 0.25
  initial_surge_command_fraction: 0.7
  min_surge_command_mps: 0.1
  pre_maneuver_duration_s: 10.0

  action_constraints:
    speed_floor_enabled: true

  action_configuration:
    yaw_rate_commands_deg_s: [-1.0, -0.5, 0.0, 0.5, 1.0]
    surge_accel_commands: [0.0]

  masking_configuration:
    debug_action_masker: false
    sim_dt: 0.5
    min_search_depth: 2
    decision_depth: 3
    certification_margin: 0.0
    fallback_robustness_tolerance: 0.5
    pruning_threshold: -2.0
    use_3dof_dynamics: true      # set true to enable shoeboxpy 3DOF integration
    shoebox_sub_dt: 0.1           # RK4 substep within each sim_dt chunk (s)
    # CSAD parameters (from McHorcrux csad.json, freq index 41).
    # alpha/beta are back-calculated so shoebox's MA and D match CSAD derivatives:
    #   m_sb = rho*L*B*T = 156.04 kg,  Izz_sb = 89.00 kg·m²
    shoebox_L: 2.578
    shoebox_B: 0.444
    shoebox_T: 0.133
    shoebox_rho: 1025.0
    shoebox_alpha_u: 0.11009      # Xu_dot / m_sb  = 17.178  / 156.04
    shoebox_alpha_v: 0.86267      # Yv_dot / m_sb  = 134.610 / 156.04
    shoebox_alpha_r: 0.58680      # Nr_dot / Izz_sb = 52.225 / 89.00
    shoebox_beta_u: 0.30137       # Xu     / m_sb  = 47.025  / 156.04
    shoebox_beta_v: 2.36154       # Yv     / m_sb  = 368.497 / 156.04
    shoebox_beta_r: 2.84762       # Nr     / Izz_sb = 253.439 / 89.00

  encounter_configuration:
    start_position: [1.5, 7.5, 0.0]
    wave_conditions: [0.05, 1.5, 0.0]
    encounter_type: crossing
    separation: 40.0
    target_speed: 0.2
    goal_ahead_distance: 60.0
    collision_radius: 2.0
    simtime: 500.0
    maneuver_horizon: 10.0

  monitoring_configuration:
    masking_enabled: true
    monitoring_radius: 40.0
    monitoring_radius_safety_factor: 4.0
    robustness_margin: 40.0
    robustness_sampling_rate: 1
    mask_recompute_interval: 1

  reward_configuration:
    # ColregsReward handlers
    reward_fallback:
      is_enabled: false
      coefficient: -1

    reward_acceleration:
      is_enabled: true
      # Penalises changes in the agent's held commands (r_i, a_j), not
      # controller torques. The accel weight normalises one accel grid step
      # (0.003 m/s^2) to roughly one yaw-rate grid step (0.5 deg/s).
      coefficient: -0.05
      yaw_rate_delta_coefficient: 1.0
      surge_accel_delta_coefficient: 166.6667

    reward_reverse_driving:
      is_enabled: true
      coefficient: -40.0

    reward_termination:
      is_enabled: true
      reward_goal_reached:    50.0
      reward_collision:      -50.0
      reward_time_out:       -20.0
      reward_out_of_bounds:  -20.0

    reward_velocity:
      is_enabled: true
      # Applied to actual surge speed u = sim_state["nu"][0] in m/s.
      low_speed_mps:   0.36
      high_speed_mps:  0.40
      coefficient:     1.0

    reward_goal_distance:
      is_enabled: true
      final_approach_start_dist:           5.0   # c1
      euclidean_advance_coeff:             1.0   # c2
      orientation_advance_coeff:           1.0   # c3
      final_approach_euclidean_dist_coeff: 0.0   # c5 (set negative to enable)
      final_approach_distance_coeff:       1.0   # c6
      final_approach_linearization_coeff:  0.0   # c7 (set positive to enable)
      timestep_normalization:             5 

    reward_lateral_deviation:
      is_enabled: true
      coefficient:              -0.005   # c4
      clip:                      5.0    # c8 (0 = no clip)
      final_approach_start_dist: 5.0    # c1

    reward_wrong_side_crossing:
      is_enabled: true
      coefficient: -75.0
      east_margin_m: 0.0

    reward_safe_distance:
      is_enabled: true
      magnitude:                   75.0
      clip:                       -10.0
      starboard_static_coeff:      0.007
      port_static_coeff:           0.09
      stern_static_coeff:          0.01
      starboard_dyn_plus_coeff:    0.004
      starboard_dyn_minus_coeff:   0.05
      port_dyn_plus_coeff:         0.007
      port_dyn_minus_coeff:        0.005
      stern_dyn_plus_coeff:        0.007
      stern_dyn_minus_coeff:       0.005
